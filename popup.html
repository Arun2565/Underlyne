<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underlyne</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Underlyne</h1>
      <span id="count" class="count">0</span>
    </header>

    <section class="defaults-section">
      <div class="color-row">
        <label>Highlight:</label>
        <div class="color-options" id="hl-colors"></div>
      </div>
      <div class="color-row">
        <label>Underline:</label>
        <div class="color-options" id="ul-colors"></div>
      </div>
    </section>

    <section class="actions">
      <button id="btn-export" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
      <button id="btn-import" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import
      </button>
      <button id="btn-markdown" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Markdown
      </button>
      <button id="btn-clear-all" class="btn btn-danger">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Clear
      </button>
    </section>

    <div id="import-input" class="import-area" style="display:none">
      <textarea id="import-textarea" placeholder="Paste exported JSON here..."></textarea>
      <button id="btn-do-import" class="btn btn-primary">Import</button>
    </div>

    <section id="highlights-section">
      <h2>Annotations</h2>
      <div id="empty-state" class="empty-state">No annotations on this page.</div>
      <ul id="highlights-list"></ul>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
